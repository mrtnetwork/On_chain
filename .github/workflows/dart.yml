name: Dart

# All four backends: pure Dart (VM + browser), Rust FFI (VM),
# Rust WASM (browser). The Rust crate is checked out from
# mrtnetwork/blockchain-utils ($BU_RUST_CRATE); the connector comes from
# its git dependency, blockchain_utils + onchain_proto from sibling
# checkouts (path dependencies — see pubspec.yaml).
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  BU_RUST_CRATE: ${{ github.workspace }}/rust-crate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-vm:
    name: Dart backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BU_BACKEND: dart
    steps:
      - name: Checkout on_chain
        uses: actions/checkout@v4
        with:
          path: On_chain

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Checkout onchain_proto (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/onchain_proto
          path: onchain_proto

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: On_chain
        run: dart pub get --no-example

      - name: Analyze
        working-directory: On_chain
        # Scoped to non-example code: example/ is a Flutter app (needs the
        # Flutter SDK; `dart pub get --no-example` skips it, so analyze it
        # with `flutter analyze` instead).
        run: dart analyze lib test tool

      - name: Run tests (pure Dart)
        working-directory: On_chain
        run: dart test test/one_shot_test.dart

  ffi-vm:
    name: Rust FFI backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BU_BACKEND: ffi
    steps:
      - name: Checkout on_chain
        uses: actions/checkout@v4
        with:
          path: On_chain

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Checkout onchain_proto (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/onchain_proto
          path: onchain_proto

      - name: Checkout Rust crate
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain-utils
          path: rust-crate

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-crate -> target"

      - name: Install dependencies
        working-directory: On_chain
        run: dart pub get --no-example

      - name: Analyze
        working-directory: On_chain
        # Scoped to non-example code: example/ is a Flutter app (needs the
        # Flutter SDK; `dart pub get --no-example` skips it, so analyze it
        # with `flutter analyze` instead).
        run: dart analyze lib test tool

      - name: Build FFI backend
        working-directory: On_chain
        run: dart tool/build_backends.dart --ffi

      - name: Run tests (FFI)
        working-directory: On_chain
        run: dart test test/one_shot_test.dart --timeout=5m

  dart-web:
    name: Dart backend (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout on_chain
        uses: actions/checkout@v4
        with:
          path: On_chain

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Checkout onchain_proto (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/onchain_proto
          path: onchain_proto

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: On_chain
        run: dart pub get --no-example

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (pure Dart)
        working-directory: On_chain
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: >
          dart test -p chrome test/one_shot_browser_dart_test.dart
          --timeout=20m

  wasm-web:
    name: Rust WASM backend (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout on_chain
        uses: actions/checkout@v4
        with:
          path: On_chain

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Checkout onchain_proto (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/onchain_proto
          path: onchain_proto

      - name: Checkout Rust crate
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain-utils
          path: rust-crate

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-crate -> target"

      - name: Install wasm-bindgen-cli (pinned to Cargo.toml)
        run: |
          BIN="${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"
          if [ -x "$BIN" ]; then "$BIN" --version; exit 0; fi
          VER=$(sed -n 's/^wasm-bindgen = { version = "=\([0-9.]*\)".*/\1/p' "$BU_RUST_CRATE/Cargo.toml" | head -n 1)
          if [ -z "$VER" ]; then
            echo "cannot parse wasm-bindgen version from Cargo.toml"
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: Install dependencies
        working-directory: On_chain
        run: dart pub get --no-example

      - name: Build WASM assets into test/wasm_assets
        # --force: always rebuild from the checked-out sources (never trust
        # possibly-committed test/wasm_assets), then run the browser suites
        # against that fresh build.
        working-directory: On_chain
        run: dart tool/build_backends.dart --wasm --force

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (WASM)
        working-directory: On_chain
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: >
          dart test -p chrome test/browser_wasm_test.dart
          test/one_shot_browser_wasm_test.dart --timeout=20m
