name: on_chain
description: "Multi-chain Dart SDK for Ethereum, Tron, Solana, Sui, Aptos, Cardano, NEAR, Tezos, Algorand, Hedera, ICP and Filecoin: wallets, transactions and contracts."
version: 9.0.2
homepage: "https://github.com/mrtnetwork/on_chain"
repository: "https://github.com/mrtnetwork/on_chain"
Author: mrhaydari.t@gmail.com

# Test fixture, not a real credential: Aptos keyless tests use a public
# Google OAuth client ID as the ZK `aud` field (client IDs are public
# identifiers; see test/aptos/keyless_test.dart).
false_secrets:
  - test/aptos/keyless_test.dart

topics:
  - ethereum
  - tron
  - solana
  - sui
  - aptos
  
environment:
  sdk: '>=3.7.0 <4.0.0'


dependencies:
  blockchain_utils: ^8.0.1
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
  flutter_lints: ^6.0.0
  onchain_proto:
    git:
      url: https://github.com/mrtnetwork/onchain_proto
  blockchain_utils_connector: ^0.1.1
